# Publishes a GitHub release with one plugin archive per platform when a version tag (v*) is
# pushed. The tag must match package.json's version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/build.yml
    with:
      platform: build:linux
      checks: true

  build:
    needs: check
    strategy:
      matrix:
        platform:
          - build:linux
          - build:linuxARM64
          - build:linuxARM
          - build:darwin
          - build:darwinARM64
          - build:windows
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      checks: false

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag matches version
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ needs.check.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${{ needs.check.outputs.version }}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: consi-timestral-app-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "grafana-timestral $GITHUB_REF_NAME" \
            --notes "Download the archive for your platform and unzip it into Grafana's plugins directory. Includes Mistral AI's Timestral-209M weights under their Modified MIT license (model/LICENSE), which does not cover companies with more than USD 20 million in monthly revenue. See NOTICE."
