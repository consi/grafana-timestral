services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    ports:
      - 3000:3000
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-https://prometheus.demo.prometheus.io}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: consi-timestral-app,consi-timestral-panel,consi-timestral-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/timestral-demo.json
    volumes:
      - ./dist:/var/lib/grafana/plugins/consi-timestral-app
      - ./provisioning:/etc/grafana/provisioning
